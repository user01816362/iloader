name: "Build iloader"

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:
    inputs:
      macos:
        description: "Build macOS"
        required: false
        default: true
        type: boolean
      linux:
        description: "Build Linux (x64)"
        required: false
        default: false
        type: boolean
      linux_arm:
        description: "Build Linux (ARM)"
        required: false
        default: false
        type: boolean
      windows:
        description: "Build Windows"
        required: false
        default: false
        type: boolean
      create_release:
        description: "Create a GitHub release with built artifacts"
        required: false
        default: false
        type: boolean
      tag:
        description: "Release tag (e.g. v2.3.4) — only used if create_release is true"
        required: false
        default: ""
        type: string
  release:
    types: [published]

jobs:
  build:
    permissions:
      contents: write
    env:
      HAVE_SIGNING_SECRETS: ${{ secrets.DEV_ID_P12_BASE64 != '' && secrets.DEV_ID_P12_PASSWORD != '' && secrets.DEV_IDENTITY_NAME != '' }}
      HAVE_NOTARIZE_SECRETS: ${{ secrets.NOTARIZE_APPLE_ID != '' && secrets.NOTARIZE_APP_SPECIFIC_PASS != '' && secrets.NOTARIZE_TEAM_ID != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            args: "--bundles deb"
            label: "linux"
          - platform: "ubuntu-22.04"
            args: "--bundles rpm"
            label: "linux"
          - platform: "ubuntu-22.04"
            args: "--bundles appimage"
            label: "linux"
          - platform: "ubuntu-22.04-arm"
            args: "--bundles appimage"
            label: "linux-arm"
          - platform: "ubuntu-22.04-arm"
            args: "--bundles deb"
            label: "linux-arm"
          - platform: "ubuntu-22.04-arm"
            args: "--bundles rpm"
            label: "linux-arm"
          - platform: "windows-latest"
            args: ""
            label: "windows"
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
            label: "macos"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Skip if platform not selected (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          case "${{ matrix.label }}" in
            macos)     [ "${{ inputs.macos }}" = "true" ] && echo "selected=true" >> $GITHUB_ENV || echo "selected=false" >> $GITHUB_ENV ;;
            linux)     [ "${{ inputs.linux }}" = "true" ] && echo "selected=true" >> $GITHUB_ENV || echo "selected=false" >> $GITHUB_ENV ;;
            linux-arm) [ "${{ inputs.linux_arm }}" = "true" ] && echo "selected=true" >> $GITHUB_ENV || echo "selected=false" >> $GITHUB_ENV ;;
            windows)   [ "${{ inputs.windows }}" = "true" ] && echo "selected=true" >> $GITHUB_ENV || echo "selected=false" >> $GITHUB_ENV ;;
            *)         echo "selected=false" >> $GITHUB_ENV ;;
          esac

      - name: Skip check
        if: github.event_name == 'workflow_dispatch' && env.selected == 'false'
        run: echo "Skipping ${{ matrix.label }} — not in selected platforms"

      - uses: actions/checkout@v6
        if: github.event_name != 'workflow_dispatch' || env.selected == 'true'

      - name: Cache Rust and bun dependencies
        if: github.event_name != 'workflow_dispatch' || env.selected == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            node_modules
          key: ${{ matrix.platform }}-iloader-${{ hashFiles('**/Cargo.lock', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-iloader-

      - name: Install Rust stable
        if: github.event_name != 'workflow_dispatch' || env.selected == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: (github.event_name != 'workflow_dispatch' || env.selected == 'true') && (matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf perl make${{ matrix.args == '--bundles appimage' && ' xdg-utils' || '' }}

      - name: Add MSVC to PATH
        if: (github.event_name != 'workflow_dispatch' || env.selected == 'true') && matrix.platform == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Perl and Make for Windows
        if: (github.event_name != 'workflow_dispatch' || env.selected == 'true') && matrix.platform == 'windows-latest'
        run: |
          choco install strawberryperl make --no-progress

      - uses: oven-sh/setup-bun@v2
        if: github.event_name != 'workflow_dispatch' || env.selected == 'true'
        with:
          bun-version: latest

      - name: Install frontend dependencies
        if: github.event_name != 'workflow_dispatch' || env.selected == 'true'
        run: bun i --frozen-lockfile

      - name: Clean old bundles
        if: (github.event_name != 'workflow_dispatch' || env.selected == 'true') && matrix.platform != 'macos-latest'
        run: bunx rimraf src-tauri/target/release/bundle

      - name: Clean old bundles
        if: (github.event_name != 'workflow_dispatch' || env.selected == 'true') && matrix.platform == 'macos-latest'
        run: |
          bunx rimraf src-tauri/target/aarch64-apple-darwin/release/bundle
          bunx rimraf src-tauri/target/x86_64-apple-darwin/release/bundle
          bunx rimraf src-tauri/target/universal-apple-darwin/release/bundle

      - name: Export Apple signing secrets (release only)
        if: (github.event_name != 'workflow_dispatch' || env.selected == 'true') && matrix.platform == 'macos-latest' && env.HAVE_SIGNING_SECRETS == 'true' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.create_release))
        run: |
          echo "APPLE_CERTIFICATE=${{ secrets.DEV_ID_P12_BASE64 }}" >> $GITHUB_ENV
          echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.DEV_ID_P12_PASSWORD }}" >> $GITHUB_ENV
          echo "APPLE_SIGNING_IDENTITY=${{ secrets.DEV_IDENTITY_NAME }}" >> $GITHUB_ENV
          echo "APPLE_TEAM_ID=${{ secrets.NOTARIZE_TEAM_ID }}" >> $GITHUB_ENV

      - name: Export signing secrets
        if: (github.event_name != 'workflow_dispatch' || env.selected == 'true') && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.create_release))
        shell: bash
        run: |
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY=${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" >> $GITHUB_ENV
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" >> $GITHUB_ENV
          fi

      - name: Build
        if: github.event_name != 'workflow_dispatch' || env.selected == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }} ${{ (github.event_name != 'release' && !(github.event_name == 'workflow_dispatch' && inputs.create_release)) && ' --config src-tauri/ci.conf.json' || '' }}
          includeUpdaterJson: false
          releaseId: ${{ github.event_name == 'release' && github.event.release.id || '' }}
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          releaseName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          assetNamePattern: "[name]-[platform]-[arch][ext]"

      - name: Notarize & Staple DMG (release only)
        if: (github.event_name != 'workflow_dispatch' || env.selected == 'true') && matrix.platform == 'macos-latest' && env.HAVE_NOTARIZE_SECRETS == 'true' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.create_release))
        run: |
          DMG_PATH=$(find src-tauri/target -name "*.dmg" -print -quit)
          if [ -z "$DMG_PATH" ]; then
            echo "No DMG found to notarize" >&2
            exit 1
          fi
          echo "Submitting $DMG_PATH to Apple notarization…"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "${{ secrets.NOTARIZE_APPLE_ID }}" \
            --password "${{ secrets.NOTARIZE_APP_SPECIFIC_PASS }}" \
            --team-id "${{ secrets.NOTARIZE_TEAM_ID }}" \
            --wait --verbose
          xcrun stapler staple "$DMG_PATH"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v7
        if: (github.event_name != 'workflow_dispatch' || env.selected == 'true') && matrix.platform == 'macos-latest'
        with:
          name: macos-dmg-universal
          path: ${{ github.workspace }}/src-tauri/target/**/release/bundle/**/*.dmg

      - name: Upload Linux DEB
        uses: actions/upload-artifact@v7
        if: (github.event_name != 'workflow_dispatch' || env.selected == 'true') && matrix.platform == 'ubuntu-22.04' && matrix.args == '--bundles deb'
        with:
          name: linux-deb
          path: ${{ github.workspace }}/src-tauri/target/release/bundle/**/*.deb

      - name: Upload Linux RPM
        uses: actions/upload-artifact@v7
        if: (github.event_name != 'workflow_dispatch' || env.selected == 'true') && matrix.platform == 'ubuntu-22.04' && matrix.args == '--bundles rpm'
        with:
          name: linux-rpm
          path: ${{ github.workspace }}/src-tauri/target/release/bundle/**/*.rpm

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v7
        if: (github.event_name != 'workflow_dispatch' || env.selected == 'true') && matrix.platform == 'ubuntu-22.04' && matrix.args == '--bundles appimage'
        with:
          name: linux-appimage
          path: ${{ github.workspace }}/src-tauri/target/release/bundle/**/*.AppImage

      - name: Upload Linux DEB (ARM)
        uses: actions/upload-artifact@v7
        if: (github.event_name != 'workflow_dispatch' || env.selected == 'true') && matrix.platform == 'ubuntu-22.04-arm' && matrix.args == '--bundles deb'
        with:
          name: linux-deb-arm
          path: ${{ github.workspace }}/src-tauri/target/release/bundle/**/*.deb

      - name: Upload Linux RPM (ARM)
        uses: actions/upload-artifact@v7
        if: (github.event_name != 'workflow_dispatch' || env.selected == 'true') && matrix.platform == 'ubuntu-22.04-arm' && matrix.args == '--bundles rpm'
        with:
          name: linux-rpm-arm
          path: ${{ github.workspace }}/src-tauri/target/release/bundle/**/*.rpm

      - name: Upload Linux AppImage (ARM)
        uses: actions/upload-artifact@v7
        if: (github.event_name != 'workflow_dispatch' || env.selected == 'true') && matrix.platform == 'ubuntu-22.04-arm' && matrix.args == '--bundles appimage'
        with:
          name: linux-appimage-arm
          path: ${{ github.workspace }}/src-tauri/target/release/bundle/**/*.AppImage

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v7
        if: (github.event_name != 'workflow_dispatch' || env.selected == 'true') && matrix.platform == 'windows-latest'
        with:
          name: windows-exe
          path: |
            ${{ github.workspace }}/src-tauri/target/release/bundle/**/*.exe

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.create_release && inputs.tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag }}" \
            --title "iloader ${{ inputs.tag }}" \
            --generate-notes \
            --repo "${{ github.repository }}" \
            artifacts/*

  mark-latest:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Ensure gh CLI is available
        run: |
          if ! command -v gh >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi

      - name: Authenticate gh
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Mark release as latest
        run: |
          gh release edit "${{ github.event.release.tag_name }}" --latest --repo "${{ github.repository }}"
